[tool.poetry]
name = "restaurant-ai-service"
version = "1.0.0"
description = "FastAPI AI Service for Agentic Restaurant Chatbot"
authors = ["Your Name"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
langchain = "^0.1.0"
google-cloud-aiplatform = "^1.38.0"
google-cloud-firestore = "^2.13.0"
neo4j = "^5.14.0"
pymongo = "^4.6.0"
pinecone-client = "^3.0.0"
openai = "^1.3.0"
aiohttp = "^3.9.0"
httpx = "^0.25.0"
scikit-learn = "^1.3.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
python-json-logger = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
mypy = "^1.7.0"
black = "^23.12.0"
pylint = "^3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
